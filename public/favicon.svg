<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo escuro arredondado -->
  <rect width="512" height="512" rx="128" fill="#0A0D16"/>
  
  <!-- Borda decorativa azul -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2F6FFF" stroke-width="20" stroke-opacity="0.4"/>
  
  <!-- Texto K (Amarelo) e 9 (Azul) -->
  <g font-family="'Anton', 'Arial Black', sans-serif" font-weight="900" font-size="290" text-anchor="middle" dominant-baseline="central">
    <text x="180" y="270" fill="#FFD21A">K</text>
    <text x="345" y="270" fill="#5B8CFF">9</text>
  </g>
</svg>
